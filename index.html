<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Materiais - PyScript</title>

    <!-- PyScript que FUNCIONA no GitHub Pages -->
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>

    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: #fafafa;
            border-radius: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }
        button {
            cursor: pointer;
        }
        ul {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Lista de Materiais</h1>

    <input id="item" placeholder="Digite um material">
    <button py-click="adicionar()">Adicionar</button>

    <ul id="lista"></ul>

    <!-- Ambiente PyScript obrigatório -->
    <py-env>
        - pyscript
    </py-env>

    <!-- Código Python CORRETO -->
    <script type="py">
from pyscript import document

def adicionar():
    item = document.querySelector("#item").value

    if not item.strip():
        return

    lista = document.querySelector("#lista")

    li = document.createElement("li")
    li.innerText = item
    lista.appendChild(li)

    document.querySelector("#item").value = ""
    </script>

</body>
</html>
