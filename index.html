<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Materiais</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        button {
            cursor: pointer;
        }

        ul {
            margin-top: 20px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>Lista de Materiais</h1>

    <input id="campo" type="text" placeholder="Digite um material">
    <button onclick="adicionar()">Adicionar</button>

    <ul id="lista"></ul>

    <script>
        function adicionar() {
            let texto = document.getElementById("campo").value;

            if (texto.trim() === "") return;

            let lista = document.getElementById("lista");
            let li = document.createElement("li");
            li.innerText = texto;
            lista.appendChild(li);

            document.getElementById("campo").value = "";
        }
    </script>

</body>
</html>
