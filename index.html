<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cartas de Frases</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>

    <h1>Gerador de Cartas com Frases</h1>

    <!-- Área para digitar frases -->
    <div id="input-container">
        <textarea id="frases" placeholder="Digite uma frase por linha..."></textarea>
        <button id="gerar">Gerar URL</button>
    </div>

    <!-- Resultado da URL -->
    <div id="resultado" class="hidden">
        <h2>Sua URL:</h2>
        <input id="url" readonly>
    </div>

    <!-- Área de visualização das cartas -->
    <div id="visualizacao" class="hidden">
        <h2>Cartas:</h2>
        <div id="cartas"></div>
        <button id="embaralhar">Embaralhar Novamente</button>
    </div>

<script>
    // --- FUNÇÃO PARA EMBARALHAR ARRAY ---
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // --- SE A PÁGINA FOI ABERTA COM PARÂMETRO "f", MOSTRA AS CARTAS ---
    const params = new URLSearchParams(window.location.search);
    const frasesCodificadas = params.get("f");

    if (frasesCodificadas) {
        document.getElementById("visualizacao").classList.remove("hidden");

        let frases = frasesCodificadas.split("|");

        const container = document.getElementById("cartas");

        function renderizarCartas() {
            container.innerHTML = "";
            frases.forEach(f => {
                const card = document.createElement("div");
                card.className = "carta";
                card.textContent = f;
                container.appendChild(card);
            });
        }

        frases = shuffle(frases); // embaralha ao carregar
        renderizarCartas();

        document.getElementById("embaralhar").onclick = () => {
            frases = shuffle(frases);
            renderizarCartas();
        };
    }

    // --- GERAR URL COM FRASES DIGITADAS ---
    document.getElementById("gerar").onclick = () => {
        const texto = document.getElementById("frases").value.trim();

        if (!texto) {
            alert("Digite ao menos uma frase!");
            return;
        }

        const lista = texto.split("\n").map(f => f.trim()).filter(f => f !== "");
        const cod = lista.join("|");

        const urlGerada = `${window.location.origin}${window.location.pathname}?f=${encodeURIComponent(cod)}`;

        document.getElementById("resultado").classList.remove("hidden");
        document.getElementById("url").value = urlGerada;
    };
</script>

</body>
</html>
