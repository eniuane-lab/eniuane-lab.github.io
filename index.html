<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cartas de Frases</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>

    <h1>Gerador de Cartas com Frases</h1>

    <!-- Área para digitar frases -->
    <div id="input-container">
        <textarea id="frases" placeholder="Digite uma frase por linha..."></textarea>
        <button id="gerar">Gerar URL</button>
    </div>

    <!-- Resultado da URL -->
    <div id="resultado" class="hidden">
        <h2>Sua URL:</h2>
        <input id="url" readonly>
    </div>

    <!-- Área onde aparece somente uma carta -->
    <div id="visualizacao" class="hidden">
        <h2>Carta:</h2>

        <div id="carta-exibida" class="carta"></div>

        <div id="controles">
            <button id="anterior">◀ Anterior</button>
            <button id="proximo">Próxima ▶</button>
        </div>
    </div>

<script>
    // --- EMBARALHAR ---
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // --- SE A PÁGINA TEM PARÂMETRO "f", MOSTRAR CARTAS ---
    const params = new URLSearchParams(window.location.search);
    const frasesCodificadas = params.get("f");

    if (frasesCodificadas) {
        document.getElementById("visualizacao").classList.remove("hidden");

        let frases = frasesCodificadas.split("|");
        frases = shuffle(frases); // embaralhar ao carregar

        let index = 0;

        const carta = document.getElementById("carta-exibida");

        function atualizarCarta() {
            carta.textContent = frases[index];
        }

        atualizarCarta();

        // Botão próximo
        document.getElementById("proximo").onclick = () => {
            index = (index + 1) % frases.length;
            atualizarCarta();
        };

        // Botão anterior
        document.getElementById("anterior").onclick = () => {
            index = (index - 1 + frases.length) % frases.length;
            atualizarCarta();
        };
    }

    // --- GERAR URL COM FRASES ---
    document.getElementById("gerar").onclick = () => {
        const texto = document.getElementById("frases").value.trim();

        if (!texto) {
            alert("Digite ao menos uma frase!");
            return;
        }

        const lista = texto.split("\n").map(f => f.trim()).filter(f => f !== "");
        const cod = lista.join("|");

        const urlGerada = `${window.location.origin}${window.location.pathname}?f=${encodeURIComponent(cod)}`;

        document.getElementById("resultado").classList.remove("hidden");
        document.getElementById("url").value = urlGerada;
    };
</script>

</body>
</html>
